<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy Games</title>
<style>
:root{
  --bg:#000; --panel:#050505; --green:#00ff66; --green2:#00cc55; --dim:#0a3a1a;
  --line:#00ff6633; --text:#c8ffd8; --muted:#4f8f68;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:"Consolas","Courier New",monospace}
body{min-height:100vh;padding-bottom:60px}
a{color:var(--green);text-decoration:none}
::selection{background:var(--green);color:#000}

header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,#000 0%,#020b05 100%);
  border-bottom:1px solid var(--line);
  padding:14px 18px 12px;
}
.toprow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.logo{font-size:24px;font-weight:bold;color:var(--green);letter-spacing:2px;
  text-shadow:0 0 8px var(--green),0 0 22px #00ff6688;white-space:nowrap}
.logo small{display:block;font-size:9px;letter-spacing:4px;color:var(--muted);font-weight:normal;text-shadow:none}
#search{
  flex:1;min-width:180px;background:#020604;border:1px solid var(--line);color:var(--green);
  font-family:inherit;font-size:13px;padding:9px 12px;outline:none;
}
#search:focus{border-color:var(--green);box-shadow:0 0 10px #00ff6644}
.tabs{display:flex;gap:8px;flex-wrap:wrap;max-width:1400px;margin:10px auto 0}
.tab{
  background:#020604;border:1px solid var(--line);color:var(--muted);font-family:inherit;
  font-size:12px;padding:7px 12px;cursor:pointer;
}
.tab:hover{color:var(--green);border-color:var(--green2)}
.tab.active{background:var(--green);color:#000;font-weight:bold;border-color:var(--green)}

.count{max-width:1400px;margin:8px auto 0;font-size:11px;color:var(--muted);letter-spacing:1px}

.grid{
  max-width:1400px;margin:16px auto;padding:0 18px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;
}
.card{
  background:var(--panel);border:1px solid var(--line);cursor:pointer;overflow:hidden;
  position:relative;transition:transform .12s,box-shadow .12s,border-color .12s;
  display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-3px);border-color:var(--green);box-shadow:0 0 16px #00ff6644}
.card .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:#020604;display:block}
.card .noimg{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,#020604,#020604 10px,#031008 10px,#031008 20px);
  color:var(--dim);font-size:38px}
.card .name{padding:8px 9px;font-size:11.5px;color:var(--text);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cheatbadge{
  position:absolute;top:6px;right:6px;background:var(--green);color:#000;font-size:9px;
  font-weight:bold;padding:2px 6px;letter-spacing:1px;
}
.card.cheat .name{color:var(--green)}
.empty{max-width:1400px;margin:40px auto;text-align:center;color:var(--muted)}

/* player overlay */
#player{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.96);display:none;
  flex-direction:column;
}
#player.open{display:flex}
.pbar{
  display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:#020604;flex-wrap:wrap;
}
.pbar .ptitle{color:var(--green);font-size:14px;font-weight:bold;flex:1;min-width:120px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar button{
  background:#020604;border:1px solid var(--line);color:var(--green);font-family:inherit;
  font-size:12px;padding:7px 12px;cursor:pointer;
}
.pbar button:hover{background:var(--green);color:#000}
.pbar button.on{background:var(--green);color:#000;font-weight:bold}
#frameWrap{flex:1;position:relative;background:#000}
#gameframe{width:100%;height:100%;border:0;background:#000}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--green);font-size:14px;letter-spacing:2px;pointer-events:none}
.hidden{display:none!important}
footer{max-width:1400px;margin:20px auto;padding:0 18px;color:var(--muted);font-size:11px;
  text-align:center;letter-spacing:1px}
</style>
</head>
<body>

<header>
  <div class="toprow">
    <div class="logo">GALAXY GAMES<small>UNBLOCKED ARCADE</small></div>
    <input id="search" type="text" placeholder="search games..." autocomplete="off" spellcheck="false">
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="games">GAMES</button>
    <button class="tab" data-cat="cheats">CHEATS</button>
  </div>
  <div class="count" id="count"></div>
</header>

<div class="grid" id="grid"></div>
<div class="empty hidden" id="empty">no games found</div>

<div id="player">
  <div class="pbar">
    <div class="ptitle" id="ptitle">game</div>
    <button id="btnNew" title="open in new tab">OPEN IN NEW TAB</button>
    <button id="btnFull">FULLSCREEN</button>
    <button id="btnClose">CLOSE</button>
  </div>
  <div id="frameWrap">
    <div id="loading">LOADING...</div>
    <iframe id="gameframe" allow="autoplay; fullscreen; gamepad; clipboard-write; accelerometer; gyroscope" allowfullscreen></iframe>
  </div>
</div>

<footer>GALAXY GAMES &bull; <span id="fbase"></span></footer>

<script>
var REPO_BASE = "https://wpaxton709-ux.github.io/galaxy/";
var GAMES = [];
var CHEATS = [{"n":"Cookie Clicker","u":"cheat/Cookie Clicker.html","i":"cheat-thumbnails/Cookie Clicker.jpg","d":"Addictive idle clicker - with cheats"},{"n":"csgo clicker","u":"cheat/csgo clicker.html","i":"cheat-thumbnails/csgo clicker.png","d":"CS:GO case opening clicker - with cheats"},{"n":"Dig out of Prison","u":"cheat/Dig out of Prison.html","i":"cheat-thumbnails/Dig out of Prison.png","d":"Escape prison - with cheats"},{"n":"Gunspin","u":"cheat/Gunspin.html","i":"cheat-thumbnails/Gunspin.png","d":"Weapon spinning challenge - with cheats"},{"n":"Ragdoll Freefall 2","u":"cheat/Ragdoll Freefall 2.html","i":"cheat-thumbnails/Ragdoll Freefall 2.png","d":"Ragdoll falling game - with cheats"},{"n":"Search For The Needle","u":"cheat/Search For The Needle.html","i":"cheat-thumbnails/Search For The Needle.png","d":"Find the needle puzzle - with cheats"},{"n":"Snow Rider 3D","u":"cheat/Snow Rider 3D.html","i":"cheat-thumbnails/Snow Rider 3D.png","d":"Snowboarding trick game - with cheats"},{"n":"Tiny Fishing","u":"cheat/Tiny Fishing.html","i":"cheat-thumbnails/Tiny Fishing.jpg","d":"Relaxing fishing game - with cheats"}];

var grid = document.getElementById("grid");
var emptyEl = document.getElementById("empty");
var countEl = document.getElementById("count");
var searchEl = document.getElementById("search");
var tabs = document.querySelectorAll(".tab");
var player = document.getElementById("player");
var frame = document.getElementById("gameframe");
var ptitle = document.getElementById("ptitle");
var loading = document.getElementById("loading");

var curCat = "games";
var curQuery = "";

document.getElementById("fbase").textContent = REPO_BASE.replace("https://","").replace(/\/$/,"");

function buildSrc(rel){ return REPO_BASE + rel.split("/").map(encodeURIComponent).join("/"); }

function placeholder(){
  var d = document.createElement("div");
  d.className = "noimg";
  d.textContent = "\u25A0";
  return d;
}

function render(){
  var list = (curCat === "cheats" ? CHEATS : GAMES);
  var q = curQuery.trim().toLowerCase();
  if (q) list = list.filter(function(g){ return g.n.toLowerCase().indexOf(q) >= 0; });
  grid.innerHTML = "";
  emptyEl.classList.toggle("hidden", list.length > 0);
  countEl.textContent = list.length + " " + (curCat === "cheats" ? "CHEAT BUILDS" : "GAMES") + (q ? " MATCHING \"" + q + "\"" : "");
  list.forEach(function(g){
    var card = document.createElement("div");
    card.className = "card" + (curCat === "cheats" ? " cheat" : "");
    if (g.i){
      var img = document.createElement("img");
      img.className = "thumb"; img.loading = "lazy"; img.alt = g.n;
      img.src = buildSrc(g.i);
      img.onerror = function(){ this.replaceWith(placeholder()); };
      card.appendChild(img);
    } else {
      card.appendChild(placeholder());
    }
    var nm = document.createElement("div");
    nm.className = "name"; nm.textContent = g.n;
    card.appendChild(nm);
    if (curCat === "cheats"){
      var b = document.createElement("div");
      b.className = "cheatbadge"; b.textContent = "CHEAT";
      card.appendChild(b);
    }
    card.addEventListener("click", function(){ openGame(g); });
    grid.appendChild(card);
  });
}

function openGame(g){
  var src = buildSrc(g.u);
  loading.classList.remove("hidden");
  ptitle.textContent = g.n;
  frame.src = src;
  player.classList.add("open");
  document.body.style.overflow = "hidden";
}
frame.addEventListener("load", function(){ loading.classList.add("hidden"); });

function closeGame(){
  player.classList.remove("open");
  frame.src = "about:blank";
  document.body.style.overflow = "";
}
document.getElementById("btnClose").addEventListener("click", closeGame);
document.getElementById("btnNew").addEventListener("click", function(){
  var url = frame.src; if (url && url !== "about:blank") window.open(url, "_blank");
});
document.getElementById("btnFull").addEventListener("click", function(){
  var el = document.getElementById("frameWrap");
  if (document.fullscreenElement){ document.exitFullscreen(); }
  else if (el.requestFullscreen) { el.requestFullscreen(); }
  else if (frame.requestFullscreen) { frame.requestFullscreen(); }
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && player.classList.contains("open")) closeGame(); });

searchEl.addEventListener("input", function(){ curQuery = searchEl.value; render(); });
tabs.forEach(function(t){
  t.addEventListener("click", function(){
    tabs.forEach(function(x){ x.classList.remove("active"); });
    t.classList.add("active");
    curCat = t.getAttribute("data-cat");
    render();
  });
});

render();
</script>
</body>
</html>
