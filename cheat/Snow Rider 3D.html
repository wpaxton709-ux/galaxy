<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Snow Rider 3D</title>
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/gh/Vrkids2009/snowrider3d@6b7c2b9167b592528b221428414e63f06c4640b9/TemplateData/style.css">
	<style>
		html,
		body {
			background: #000;
		}

		#adminBtn {
			position: fixed;
			right: 10px;
			bottom: 10px;
			z-index: 20;
			padding: 8px 14px;
			background: #000;
			color: #0f0;
			border: 1px solid #0f0;
			font: bold 13px monospace;
			cursor: pointer;
		}

		#adminBtn:hover {
			background: #0f0;
			color: #000;
		}

		#adminNotice {
			position: fixed;
			left: 12px;
			bottom: 12px;
			z-index: 2147483500;
			max-width: 250px;
			padding: 10px 12px;
			background: #000;
			color: #0f0;
			border: 1px solid #0f0;
			border-radius: 6px;
			font: bold 12px monospace;
			box-shadow: 0 0 14px rgba(0, 255, 0, .35);
			cursor: pointer;
			opacity: 0;
			transform: scale(.4);
			pointer-events: none;
		}

		#adminNotice.show {
			animation: noticePop .6s cubic-bezier(.2, 1.6, .4, 1) forwards, noticePulse 1.8s ease-in-out .6s infinite;
			pointer-events: auto;
		}

		#adminNotice.hide {
			animation: noticeOut .35s ease forwards;
			pointer-events: none;
		}

		#adminNotice span {
			display: block;
			margin-top: 4px;
			color: #9f9;
			font-weight: normal;
			font-size: 10.5px;
		}

		@keyframes noticePop {
			0% {
				opacity: 0;
				transform: scale(.4) translateY(24px);
			}

			60% {
				opacity: 1;
				transform: scale(1.1) translateY(-6px);
			}

			80% {
				transform: scale(.96) translateY(0);
			}

			100% {
				opacity: 1;
				transform: scale(1) translateY(0);
			}
		}

		@keyframes noticeOut {
			to {
				opacity: 0;
				transform: scale(.7) translateY(10px);
			}
		}

		@keyframes noticePulse {

			0%,
			100% {
				box-shadow: 0 0 12px rgba(0, 255, 0, .35);
			}

			50% {
				box-shadow: 0 0 22px rgba(0, 255, 0, .8);
			}
		}

		#panel {
			position: fixed;
			right: 10px;
			bottom: 50px;
			z-index: 21;
			display: none;
			width: 240px;
			max-width: calc(100vw - 20px);
			background: #000;
			color: #0f0;
			border: 1px solid #0f0;
			font: 12px monospace;
		}

		#panel.open {
			display: block;
		}

		#panel .head {
			display: flex;
			justify-content: space-between;
			padding: 7px 9px;
			border-bottom: 1px solid #0f0;
			font-weight: bold;
		}

		#panel .head span {
			cursor: pointer;
		}

		#panel .body {
			padding: 8px;
		}

		#panel button {
			display: block;
			width: 100%;
			margin: 6px 0;
			padding: 9px;
			background: #000;
			color: #0f0;
			border: 1px solid #0f0;
			font: 12px monospace;
			cursor: pointer;
		}

		#panel button:hover {
			background: #0f0;
			color: #000;
		}

		#note {
			margin-top: 8px;
			border-top: 1px solid #0f0;
			padding-top: 6px;
			min-height: 13px;
			overflow-wrap: anywhere;
		}
	</style>
</head>

<body>
	<div class="webgl-content">
		<div id="gameContainer" style="width: 100%; height: 100%; margin: auto"></div>
	</div>

	<button id="adminBtn" type="button">ADMIN</button>
	<div id="adminNotice">ADMIN PANEL AVAILABLE<span>click ADMIN (bottom right) to open</span></div>

	<div id="panel">
		<div class="head">SAVE EDITOR <span id="close">X</span></div>
		<div class="body">
			<button id="editScore" type="button">EDIT HIGHSCORE</button>
			<button id="editPlays" type="button">EDIT PLAYS</button>
			<button id="editPresents" type="button">EDIT PRESENTS</button>
			<button id="jumpPower" type="button">JUMP x1</button>
			<button id="speed" type="button">SPEED x1</button>
			<button id="wipe" type="button">WIPE SAVE</button>
			<div id="note">click a button</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/gh/Vrkids2009/snowrider3d@6b7c2b9167b592528b221428414e63f06c4640b9/TemplateData/UnityProgress.js">
	</script>
	<script
		src="https://cdn.jsdelivr.net/gh/Vrkids2009/snowrider3d@6b7c2b9167b592528b221428414e63f06c4640b9/Build/UnityLoader.js">
	</script>
	<script>
		(function () {
			var GAME_URL = "https://cdn.jsdelivr.net/gh/Vrkids2009/snowrider3d@6b7c2b9167b592528b221428414e63f06c4640b9/Build/SnowRider3D-gd-1.json";
			var panel = document.getElementById("panel");
			var adminNotice = document.getElementById("adminNotice");
			var noteEl = document.getElementById("note");
			var sources = [];
			var scanning = false;
			var gameReady = false;

			var realRAF = window.requestAnimationFrame.bind(window);
			var rafBlocked = false;

			var realAudioContext = window.AudioContext || window.webkitAudioContext;
			var audioContexts = [];
			if (realAudioContext) {
				var WrappedAudioContext = function () {
					var ctx;
					try { ctx = Reflect.construct(realAudioContext, arguments); }
					catch (e) { ctx = new realAudioContext(); }
					audioContexts.push(ctx);
					return ctx;
				};
				window.AudioContext = WrappedAudioContext;
				window.webkitAudioContext = WrappedAudioContext;
			}

			window.requestAnimationFrame = function (cb) {
				if (rafBlocked) return 0;
				return realRAF(cb);
			};

			window.__wasmMemory = null;
			if (window.WebAssembly) {
				var origInstantiate = WebAssembly.instantiate;
				WebAssembly.instantiate = function () {
					var result = origInstantiate.apply(WebAssembly, arguments);
					if (result && typeof result.then === "function") {
						return result.then(function (r) {
							try {
								var inst = r && r.instance ? r.instance : r;
								if (inst && inst.exports && inst.exports.memory) window.__wasmMemory = inst.exports.memory;
							} catch (e) { }
							return r;
						});
					}
					return result;
				};
				if (WebAssembly.instantiateStreaming) {
					var origStreaming = WebAssembly.instantiateStreaming;
					WebAssembly.instantiateStreaming = function () {
						return origStreaming.apply(WebAssembly, arguments).then(function (r) {
							try {
								var inst = r && r.instance ? r.instance : r;
								if (inst && inst.exports && inst.exports.memory) window.__wasmMemory = inst.exports.memory;
							} catch (e) { }
							return r;
						});
					};
				}
			}

			function heapViews() {
				var mem = window.__wasmMemory;
				if (!mem) return null;
				try { return { i32: new Int32Array(mem.buffer), f32: new Float32Array(mem.buffer) }; }
				catch (e) { return null; }
			}

			function makeClock(realNow, apply) {
				var baseReal = realNow();
				var baseGame = baseReal;
				var scale = 1;
				function now() {
					return baseGame + (realNow() - baseReal) * scale;
				}
				now.hacked = true;
				apply(now);
				return function (s) {
					var r = realNow();
					baseGame += (r - baseReal) * scale;
					baseReal = r;
					scale = s;
				};
			}

			var realDateNow = Date.now.bind(Date);
			var realPerfNow = (window.performance && typeof performance.now === "function") ? performance.now.bind(performance) : null;

			var setDateScale = makeClock(realDateNow, function (fn) { Date.now = fn; });
			var setPerfScale = null;
			if (realPerfNow) {
				setPerfScale = makeClock(realPerfNow, function (fn) {
					try { performance.now = fn; } catch (e) { }
					if (!performance.now.hacked) {
						try { Object.defineProperty(performance, "now", { value: fn, writable: true, configurable: true }); } catch (e) { }
					}
				});
			}
			function setClockScale(scale) {
				setDateScale(scale);
				if (setPerfScale) setPerfScale(scale);
			}

			var KINDS = {
				highscore: {
					label: "Highscore",
					keys: ["Score", "score", "bestScore", "BestScore", "Record", "record", "distance", "Distance", "highScore", "HighScore", "Best", "best"]
				},
				plays: {
					label: "Plays",
					keys: ["plays", "Plays", "Play", "playCount", "gamesPlayed", "GamesPlayed", "totalGames"]
				},
				presents: {
					label: "Presents",
					keys: ["gifts", "Gifts", "Gift", "presents", "Presents", "coins", "Coins", "money", "Money"]
				}
			};

			function note(msg) { noteEl.textContent = msg; }

			document.getElementById("adminBtn").onclick = function () {
				hideNotice();
				panel.classList.toggle("open");
				if (panel.classList.contains("open")) ensureScan();
			};
			document.getElementById("close").onclick = function () { panel.classList.remove("open"); };
			window.addEventListener("keydown", function (e) {
				if (e.key === "`") {
					hideNotice();
					panel.classList.toggle("open");
					if (panel.classList.contains("open")) ensureScan();
				}
			});

			function req(reqObj) {
				return new Promise(function (res, rej) {
					reqObj.onsuccess = function () { res(reqObj.result); };
					reqObj.onerror = function () { rej(reqObj.error); };
				});
			}

			function openDB(name) {
				return new Promise(function (res, rej) {
					var r = indexedDB.open(name);
					r.onsuccess = function () { res(r.result); };
					r.onerror = function () { rej(r.error); };
				});
			}

			function isUPP(bytes) {
				if (!bytes || bytes.length < 16) return false;
				var m = "";
				for (var i = 0; i < 8; i++) m += String.fromCharCode(bytes[i]);
				return m === "UnityPrf";
			}

			function parseUPP(bytes) {
				var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
				var dec = new TextDecoder();
				var off = 16;
				var entries = [];
				function readStr() {
					if (off >= bytes.length) return null;
					var marker = bytes[off++];
					var len;
					if (marker < 128) len = marker;
					else if (marker === 128) {
						if (off + 4 > bytes.length) return null;
						len = dv.getInt32(off, true);
						off += 4;
					} else return null;
					if (len < 0 || off + len > bytes.length) return null;
					var s = dec.decode(bytes.subarray(off, off + len));
					off += len;
					return s;
				}
				while (off < bytes.length) {
					var key = readStr();
					if (key === null || off >= bytes.length) break;
					var marker = bytes[off++];
					if (marker < 128 || marker === 128) {
						off--;
						var val = readStr();
						if (val === null) break;
						entries.push({ key: key, type: "string", value: val });
					} else if (marker === 0xFD) {
						if (off + 4 > bytes.length) break;
						entries.push({ key: key, type: "float", value: dv.getFloat32(off, true) });
						off += 4;
					} else if (marker === 0xFE) {
						if (off + 4 > bytes.length) break;
						entries.push({ key: key, type: "int", value: dv.getInt32(off, true) });
						off += 4;
					} else break;
				}
				return entries;
			}

			function encodeUPP(header, entries) {
				var enc = new TextEncoder();
				var parts = [];
				function pushStr(s) {
					var b = enc.encode(String(s));
					if (b.length < 128) parts.push(new Uint8Array([b.length]));
					else {
						var h = new Uint8Array(5);
						h[0] = 128;
						new DataView(h.buffer).setInt32(1, b.length, true);
						parts.push(h);
					}
					parts.push(b);
				}
				parts.push(header);
				entries.forEach(function (en) {
					pushStr(en.key);
					if (en.type === "int") {
						var ib = new Uint8Array(5);
						ib[0] = 0xFE;
						new DataView(ib.buffer).setInt32(1, en.value | 0, true);
						parts.push(ib);
					} else if (en.type === "float") {
						var fb = new Uint8Array(5);
						fb[0] = 0xFD;
						new DataView(fb.buffer).setFloat32(1, Number(en.value) || 0, true);
						parts.push(fb);
					} else {
						pushStr(en.value);
					}
				});
				var total = 0;
				parts.forEach(function (p) { total += p.length; });
				var out = new Uint8Array(total);
				var off = 0;
				parts.forEach(function (p) { out.set(p, off); off += p.length; });
				return out;
			}

			async function listDatabases() {
				try {
					var dbs = await indexedDB.databases();
					var names = dbs.map(function (d) { return d.name; }).filter(function (n) { return n && n.indexOf("idbfs") >= 0; });
					if (names.indexOf("/idbfs") < 0) names.push("/idbfs");
					return names;
				} catch (e) {
					return ["/idbfs"];
				}
			}

			async function scanDB(name) {
				var db;
				try { db = await openDB(name); } catch (e) { return; }
				if (!db.objectStoreNames.contains("FILE_DATA")) { db.close(); return; }
				try {
					var store = db.transaction("FILE_DATA", "readonly").objectStore("FILE_DATA");
					var keys = await req(store.getAllKeys());
					var vals = await req(store.getAll());
					for (var i = 0; i < keys.length; i++) {
						var v = vals[i];
						if (!v || !v.contents) continue;
						var bytes;
						try { bytes = v.contents instanceof Uint8Array ? v.contents : new Uint8Array(v.contents); } catch (e) { continue; }
						if (!isUPP(bytes)) continue;
						var entries = parseUPP(bytes);
						if (entries) sources.push({ kind: "prefs", db: name, key: keys[i], rec: v, header: bytes.slice(0, 16), entries: entries });
					}
				} catch (e) { }
				db.close();
			}

			function scanLocal() {
				var entries = [];
				try {
					for (var i = 0; i < localStorage.length; i++) {
						var k = localStorage.key(i);
						entries.push({ key: k, type: "string", value: localStorage.getItem(k) });
					}
				} catch (e) { }
				if (entries.length) sources.push({ kind: "local", entries: entries });
			}

			async function scan() {
				if (scanning) return;
				scanning = true;
				sources = [];
				try {
					var names = await listDatabases();
					for (var i = 0; i < names.length; i++) await scanDB(names[i]);
				} catch (e) { }
				scanLocal();
				scanning = false;
			}

			async function ensureScan() {
				if (!sources.length) {
					note("reading save...");
					await scan();
					if (!sources.length) note("no save found - play one run first");
				}
			}

			async function writeDB(name, key, rec, bytes) {
				var db = await openDB(name);
				var tx = db.transaction("FILE_DATA", "readwrite");
				tx.objectStore("FILE_DATA").put({ timestamp: new Date(), mode: rec && rec.mode ? rec.mode : 33206, contents: bytes }, key);
				await new Promise(function (res, rej) {
					tx.oncomplete = res;
					tx.onerror = function () { rej(tx.error); };
					tx.onabort = function () { rej(tx.error); };
				});
				db.close();
			}

			function currentValue(keys) {
				for (var i = 0; i < keys.length; i++) {
					for (var j = 0; j < sources.length; j++) {
						var list = sources[j].entries;
						for (var k = 0; k < list.length; k++) {
							if (list[k].key === keys[i]) return list[k].value;
						}
					}
				}
				return 0;
			}

			function setEntry(src, key, value) {
				for (var i = 0; i < src.entries.length; i++) {
					if (src.entries[i].key === key) {
						if (src.entries[i].type === "string") src.entries[i].value = String(value);
						else src.entries[i].value = Number(value);
						return;
					}
				}
				src.entries.push({ key: key, type: "int", value: value });
			}

			function fillKeys(keys, value) {
				sources.forEach(function (src) {
					if (src.kind === "prefs") keys.forEach(function (k) { setEntry(src, k, value); });
					else src.entries.forEach(function (en) {
						if (keys.indexOf(en.key) >= 0) en.value = String(value);
					});
				});
			}

			async function saveAll() {
				for (var i = 0; i < sources.length; i++) {
					var src = sources[i];
					if (src.kind === "prefs") {
						await writeDB(src.db, src.key, src.rec, encodeUPP(src.header, src.entries));
					} else {
						src.entries.forEach(function (en) {
							try { localStorage.setItem(en.key, en.value); } catch (e) { }
						});
					}
				}
			}

			function restartGame() {
				var old = window.gameInstance;
				rafBlocked = true;
				gameReady = false;
				gameGeneration++;
				gravitySpots = [];
				gravitySet = {};
				gravityLastY = null;
				try {
					if (old && old.Module) {
						var gl = old.Module.ctx;
						if (gl) {
							var ext = gl.getExtension("WEBGL_lose_context");
							if (ext) ext.loseContext();
						}
						var contexts = [];
						if (old.Module.SDL2 && old.Module.SDL2.audioContext) contexts.push(old.Module.SDL2.audioContext);
						if (old.Module.audioContext) contexts.push(old.Module.audioContext);
						if (old.Module.webaudio && old.Module.webaudio.context) contexts.push(old.Module.webaudio.context);
						contexts.forEach(function (a) { try { a.close(); } catch (e) { } });
					}
				} catch (e) { }
				audioContexts.forEach(function (c) { try { c.close(); } catch (e) { } });
				audioContexts = [];
				var container = document.getElementById("gameContainer");
				container.innerHTML = "";
				window.gameInstance = null;
				setTimeout(function () {
					rafBlocked = false;
					window.gameInstance = UnityLoader.instantiate("gameContainer", GAME_URL, {
						onProgress: UnityProgress,
						Module: {
							onRuntimeInitialized: function () {
								gameReady = true;
								UnityProgress(window.gameInstance, "complete");
							}
						}
					});
					note("game restarted");
					setTimeout(function () {
						if (!gameReady) location.reload();
					}, 8000);
				}, 150);
			}

			async function edit(kind) {
				var def = KINDS[kind];
				await ensureScan();
				if (!sources.length) { note("no save found - play one run first"); return; }
				var raw = prompt(def.label + " - what do you want it to be?", String(currentValue(def.keys)));
				if (raw === null) return;
				var value = parseInt(raw, 10);
				if (isNaN(value)) { note("that is not a number"); return; }
				note("saving " + def.label.toLowerCase() + "...");
				fillKeys(def.keys, value);
				await saveAll();
				restartGame();
			}

			var SPEEDS = [1, 1.5, 2, 2.5, 3];
			var JUMP_POWERS = [1, 1.5, 2, 2.5, 3];
			var speedIndex = 0;
			var jumpIndex = 0;
			var gravitySpots = [];
			var gravitySet = {};
			var gravityGeneration = -1;
			var gameGeneration = 0;
			var gravityLastY = null;
			var lastGravityScan = 0;

			var savedAdmin = null;
			try { savedAdmin = JSON.parse(localStorage.getItem("srAdmin") || "null"); } catch (e) { }
			if (savedAdmin) {
				if (typeof savedAdmin.speed === "number" && savedAdmin.speed >= 0 && savedAdmin.speed < SPEEDS.length) speedIndex = savedAdmin.speed;
				if (typeof savedAdmin.jump === "number" && savedAdmin.jump >= 0 && savedAdmin.jump < JUMP_POWERS.length) jumpIndex = savedAdmin.jump;
			}
			function saveAdminPrefs() {
				try { localStorage.setItem("srAdmin", JSON.stringify({ speed: speedIndex, jump: jumpIndex })); } catch (e) { }
			}

			function scanGravity() {
				var hv = heapViews();
				if (!hv) return;
				var i32 = hv.i32;
				var target = 0xC11CF5C3 | 0;
				for (var i = 0; i + 2 < i32.length; i++) {
					if (i32[i] === 0 && i32[i + 1] === target && i32[i + 2] === 0) {
						if (!gravitySet[i + 1]) {
							gravitySet[i + 1] = 1;
							gravitySpots.push(i + 1);
						}
					}
				}
			}

			function ensureGravitySeen() {
				if (gravitySpots.length) return;
				var now = realDateNow();
				if (now - lastGravityScan < 5000) return;
				lastGravityScan = now;
				scanGravity();
			}

			function writeJumpPower() {
				var hv = heapViews();
				if (!hv || !gravitySpots.length) return;
				var f32 = hv.f32;
				var y = -9.81 / JUMP_POWERS[jumpIndex];
				var kept = [];
				for (var k = 0; k < gravitySpots.length; k++) {
					var idx = gravitySpots[k];
					var cur = f32[idx];
					if (gravityLastY === null || Math.abs(cur - gravityLastY) < 0.001 || Math.abs(cur + 9.81) < 0.001) {
						f32[idx] = y;
						kept.push(idx);
					}
				}
				gravitySpots = kept;
				gravityLastY = y;
			}

			function applyJumpPower() {
				if (!heapViews()) return -1;
				if (gravityGeneration !== gameGeneration) {
					gravitySpots = [];
					gravitySet = {};
					gravityGeneration = gameGeneration;
					gravityLastY = null;
				}
				ensureGravitySeen();
				writeJumpPower();
				return gravitySpots.length;
			}

			document.getElementById("speed").onclick = function () {
				speedIndex = (speedIndex + 1) % SPEEDS.length;
				var s = SPEEDS[speedIndex];
				setClockScale(s);
				document.getElementById("speed").textContent = "SPEED x" + s;
				saveAdminPrefs();
				note(s === 1 ? "game speed back to normal" : "game speed x" + s + " - stays on even after you die");
			};
			setClockScale(SPEEDS[speedIndex]);
			document.getElementById("speed").textContent = "SPEED x" + SPEEDS[speedIndex];
			document.getElementById("jumpPower").textContent = "JUMP x" + JUMP_POWERS[jumpIndex];

			setInterval(function () {
				if (!gameReady) return;
				if (jumpIndex === 0 && (gravityLastY === null || Math.abs(gravityLastY + 9.81) < 0.001)) return;
				if (!heapViews()) return;
				if (!gravitySpots.length) ensureGravitySeen();
				writeJumpPower();
			}, 800);

			async function wipe() {
				if (!confirm("Delete the game save?")) return;
				note("wiping save...");
				await ensureScan();
				for (var i = 0; i < sources.length; i++) {
					var src = sources[i];
					if (src.kind !== "prefs") continue;
					try {
						var db = await openDB(src.db);
						var tx = db.transaction("FILE_DATA", "readwrite");
						tx.objectStore("FILE_DATA").delete(src.key);
						await new Promise(function (res, rej) {
							tx.oncomplete = res;
							tx.onerror = function () { rej(tx.error); };
						});
						db.close();
					} catch (e) { }
				}
				sources = [];
				note("save wiped - restarting");
				restartGame();
			}

			document.getElementById("editScore").onclick = function () {
				edit("highscore").catch(function (e) { note("failed: " + e.message); });
			};
			document.getElementById("editPlays").onclick = function () {
				edit("plays").catch(function (e) { note("failed: " + e.message); });
			};
			document.getElementById("editPresents").onclick = function () {
				edit("presents").catch(function (e) { note("failed: " + e.message); });
			};
			document.getElementById("jumpPower").onclick = function () {
				jumpIndex = (jumpIndex + 1) % JUMP_POWERS.length;
				var power = JUMP_POWERS[jumpIndex];
				note("jump power x" + power + "...");
				setTimeout(function () {
					var count = applyJumpPower();
					document.getElementById("jumpPower").textContent = "JUMP x" + power;
					saveAdminPrefs();
					if (count < 0) note("jump: game still loading - try again in a moment");
					else if (count === 0) note("jump x" + power + ": gravity not found here");
					else note("jump power x" + power + " on - stays on even after you die");
				}, 40);
			};
			document.getElementById("wipe").onclick = function () {
				wipe().catch(function (e) { note("wipe failed: " + e.message); });
			};

			adminNotice.onclick = function () {
				hideNotice();
				panel.classList.add("open");
				ensureScan();
			};
			function hideNotice() {
				adminNotice.classList.remove("show");
				adminNotice.classList.add("hide");
				setTimeout(function () { adminNotice.classList.remove("hide"); }, 400);
			}
			var noticeAudio = null;
			var noticeSoundPlayed = false;
			function playNoticeSound() {
				if (noticeSoundPlayed || !adminNotice.classList.contains("show")) return;
				try {
					var AC = window.AudioContext || window.webkitAudioContext;
					if (!AC) return;
					if (!noticeAudio || noticeAudio.state === "closed") noticeAudio = new AC();
					var go = function () {
						if (noticeSoundPlayed || noticeAudio.state !== "running") return;
						noticeSoundPlayed = true;
						var t = noticeAudio.currentTime;
						[880, 1174.66].forEach(function (f, i) {
							var o = noticeAudio.createOscillator(), g = noticeAudio.createGain();
							o.type = "sine";
							o.frequency.setValueAtTime(f, t + i * 0.09);
							g.gain.setValueAtTime(0.0001, t + i * 0.09);
							g.gain.exponentialRampToValueAtTime(0.09, t + i * 0.09 + 0.02);
							g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.35);
							o.connect(g).connect(noticeAudio.destination);
							o.start(t + i * 0.09);
							o.stop(t + i * 0.09 + 0.4);
						});
					};
					if (noticeAudio.state === "suspended") noticeAudio.resume().then(go).catch(function () { });
					else go();
				} catch (e) { }
			}
			function showNotice() {
				adminNotice.classList.remove("hide");
				adminNotice.classList.add("show");
				playNoticeSound();
				window.addEventListener("pointerdown", playNoticeSound, { once: true });
				window.addEventListener("keydown", playNoticeSound, { once: true });
				setTimeout(hideNotice, 11000);
			}
			setTimeout(showNotice, 1200);
		})();
	</script>
