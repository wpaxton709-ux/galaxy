<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Search For The Needle</title>
<style>
        canvas:focus { outline: none; }
        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            height: 100%;
        }
    </style>
<script>
window.GAME_CFG = {
  CDN: "https://cdn.jsdelivr.net/gh/tsubasamasa/masabatasabasa@dd67bc4/",
  DATA_PARTS: 7,
  WASM_PARTS: 6,
  LANG: "en",
  BROTLI: "https://cdn.jsdelivr.net/npm/brotli-dec-wasm@2.3.2/index.js"
};

window.GAME_U = function (p) {
  var base = String(window.GAME_CFG.CDN || "").replace(/\/+$/, "");
  return base ? base + "/" + p : p;
};

(function () {
  var l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = window.GAME_U("style.css");
  document.head.appendChild(l);
})();

(function () {
  var LANG = window.GAME_CFG.LANG;
  var LS = "ya_player_data", LSS = "ya_player_stats";
  function rd(k, f) { try { return JSON.parse(localStorage.getItem(k) || f); } catch (e) { return JSON.parse(f); } }
  function wr(k, o) { try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} }
  var pdata = rd(LS, "{}"), pstats = rd(LSS, "{}");
  var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  function cb(o, n, a) { try { if (o && o.callbacks && typeof o.callbacks[n] === "function") o.callbacks[n](a); } catch (e) {} }

  var yplayer = {
    getUniqueID: function () { return "local-player"; },
    getName: function () { return "Player"; },
    getPhoto: function () { return ""; },
    getMode: function () { return "lite"; },
    isAuthorized: function () { return false; },
    getPayingStatus: function () { return "unknown"; },
    getIDsPerGame: function () { return Promise.resolve([]); },
    getData: function () { return Promise.resolve(JSON.parse(JSON.stringify(pdata))); },
    setData: function (d) { pdata = Object.assign(pdata, d || {}); wr(LS, pdata); return Promise.resolve(); },
    getStats: function () { return Promise.resolve(JSON.parse(JSON.stringify(pstats))); },
    setStats: function (d) { pstats = Object.assign(pstats, d || {}); wr(LSS, pstats); return Promise.resolve(); },
    incrementStats: function (d) {
      Object.keys(d || {}).forEach(function (k) { pstats[k] = (+pstats[k] || 0) + (+d[k] || 0); });
      wr(LSS, pstats); return Promise.resolve(JSON.parse(JSON.stringify(pstats)));
    },
    signIn: function () { return Promise.reject(new Error("no auth")); }
  };

  var ysdkLocal = {
    environment: { app: { id: "0" }, browser: { lang: LANG }, i18n: { lang: LANG, tld: "com" }, payload: null, isTelegram: false },
    deviceInfo: {
      type: isMobile ? "mobile" : "desktop",
      isMobile: function () { return isMobile; },
      isDesktop: function () { return !isMobile; },
      isTablet: function () { return false; },
      isTV: function () { return false; }
    },
    adv: {
      showFullscreenAdv: function (o) { cb(o, "onOpen"); setTimeout(function () { cb(o, "onClose", false); }, 300); },
      showRewardedVideo: function (o) {
        cb(o, "onOpen");
        setTimeout(function () { cb(o, "onRewarded"); setTimeout(function () { cb(o, "onClose"); }, 120); }, 400);
      },
      showBannerAdv: function () { return Promise.resolve({ stickyAdvIsShowing: false, reason: "UNKNOWN" }); },
      hideBannerAdv: function () { return Promise.resolve({ stickyAdvIsShowing: false }); },
      getBannerAdvStatus: function () { return Promise.resolve({ stickyAdvIsShowing: false, reason: "UNKNOWN" }); }
    },
    features: {
      LoadingAPI: { ready: function () {} },
      GameplayAPI: { start: function () {}, stop: function () {} },
      GamesAPI: { getAllGames: function () { return Promise.resolve({ games: [], developerURL: "" }); },
                  getGameByID: function () { return Promise.resolve({ isAvailable: false, game: null }); } }
    },
    leaderboards: {
      setScore: function () { return Promise.resolve(); },
      getDescription: function (n) {
        return Promise.resolve({ name: n, "default": true, title: {},
          description: { invert_sort_order: false, score_format: { type: "numeric", options: { decimal_offset: 0 } }, type: "numeric" } });
      },
      getPlayerEntry: function () { return Promise.reject({ code: "LEADERBOARD_PLAYER_NOT_PRESENT" }); },
      getEntries: function () { return Promise.resolve({ leaderboard: {}, ranges: [], userRank: 0, entries: [] }); }
    },
    screen: {
      fullscreen: {
        get status() { return document.fullscreenElement ? "on" : "off"; },
        request: function () { try { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); } catch (e) {} return Promise.resolve(); },
        exit: function () { try { if (document.exitFullscreen) document.exitFullscreen(); } catch (e) {} return Promise.resolve(); }
      }
    },
    feedback: {
      canReview: function () { return Promise.resolve({ value: false, reason: "NO_AUTH" }); },
      requestReview: function () { return Promise.resolve({ feedbackSent: false }); }
    },
    shortcut: {
      canShowPrompt: function () { return Promise.resolve({ canShow: false }); },
      showPrompt: function () { return Promise.resolve({ outcome: "rejected" }); }
    },
    clipboard: { writeText: function (t) { try { return navigator.clipboard.writeText(t); } catch (e) { return Promise.resolve(); } } },
    auth: { openAuthDialog: function () { return Promise.reject(new Error("no auth")); } },
    getPlayer: function () { return Promise.resolve(yplayer); },
    getLeaderboards: function () { return Promise.resolve(ysdkLocal.leaderboards); },
    getPayments: function () { return Promise.reject(new Error("payments unavailable")); },
    getFlags: function () { return Promise.resolve({}); },
    getStorage: function () { return Promise.resolve(window.localStorage); },
    isAvailableMethod: function () { return Promise.resolve(false); },
    dispatchEvent: function () { return Promise.resolve(); },
    onEvent: function () { return function () {}; },
    on: function () { return function () {}; },
    off: function () {},
    EVENT: { EXIT: "EXIT", HISTORY_BACK: "HISTORY_BACK" },
    exit: function () { return Promise.resolve(); }
  };

  function deep() {
    var fn = function () { return Promise.resolve(true); };
    return new Proxy(fn, {
      get: function (t, p) {
        if (p === "then" || p === "catch" || p === "finally") return undefined;
        if (p === Symbol.toPrimitive) return function () { return 0; };
        if (p === "toString" || p === "valueOf") return function () { return ""; };
        return deep();
      },
      apply: function () { return Promise.resolve(true); }
    });
  }
  var proxied = new Proxy(ysdkLocal, {
    get: function (t, p) {
      if (p === "then" || p === "catch" || p === "finally") return undefined;
      if (p in t) return t[p];
      if (typeof p === "symbol") return undefined;
      return deep();
    }
  });

  window.YaGames = { init: function () { return Promise.resolve(proxied); } };
  window.ysdkLang = LANG;
})();
</script>
</head>
<body class="dark">
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas" tabindex="-1"></canvas>
</div>
<div id="loading-cover" style="display:none;">
<div id="unity-loading-bar">
<div id="unity-progress-bar-empty" style="display: none;">
<div id="unity-progress-bar-full"></div>
</div>
<div class="spinner"></div>
</div>
</div>
<script>
        var CFG = window.GAME_CFG;
        var U = window.GAME_U;

        var hideFullScreenButton = "";
        var buildUrl = U("Build");
        var loaderUrl = buildUrl + "/NeedleGame.loader.js";
        var config = {
            dataUrl: null,
            frameworkUrl: null,
            codeUrl: null,
            streamingAssetsUrl: U("StreamingAssets"),
            companyName: "LuckyBox",
            productName: "Search For The needle",
            productVersion: "0.1.0"
        };

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingCover = document.querySelector("#loading-cover");
        var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var spinner = document.querySelector('.spinner');

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
        }

        loadingCover.style.display = "";

        var StartUnityInstance;
        var ygGameInstance = null;
        var ysdk = null;
        var initYSDK = false;
        var initGame = false;
        var syncInit = false;
        var isVisibility = true;
        var isPausedGame = false;
        var loaderReady = false;
        var filesReady = false;
        var unityStarted = false;
        var NO_DATA = 'no data';

        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        document.addEventListener('visibilitychange', function () { SetVisibility(!document.hidden); });
        window.addEventListener('blur', function () { SetVisibility(false); });
        window.addEventListener('focus', function () { SetVisibility(true); });
        window.addEventListener('pointerdown', function () { FocusGame(); SetVisibility(true); });
        window.addEventListener('resize', function () { FocusGame(); });
        document.addEventListener('fullscreenchange', function () { FocusGame(); });

        var oRequestPointerLock = Element.prototype.requestPointerLock;
        if (oRequestPointerLock) {
            Element.prototype.requestPointerLock = function () {
                try {
                    var r = oRequestPointerLock.apply(this, arguments);
                    if (r && typeof r["catch"] === "function") return r["catch"](function () {});
                    return r;
                } catch (e) {}
            };
        }
        var oRequestFullscreen = Element.prototype.requestFullscreen;
        if (oRequestFullscreen) {
            Element.prototype.requestFullscreen = function () {
                try {
                    var r = oRequestFullscreen.apply(this, arguments);
                    if (r && typeof r["catch"] === "function") return r["catch"](function () {});
                    return r;
                } catch (e) { return Promise.resolve(); }
            };
        }

        function InstallBlurFocusBlocker() {
            if (!('onblur' in document)) return;
            if (window.blurFocusHandlersInstalled) return;

            window.addEventListener('blur', function () {
                var blockerButton = document.createElement('button');
                blockerButton.style.position = 'fixed';
                blockerButton.style.top = '0';
                blockerButton.style.left = '0';
                blockerButton.style.width = '100%';
                blockerButton.style.height = '100%';
                blockerButton.style.zIndex = '9999';
                blockerButton.style.backgroundColor = 'rgba(0, 0, 0, 0)';
                blockerButton.style.border = 'none';
                blockerButton.style.cursor = 'default';
                document.body.appendChild(blockerButton);

                function removeBlocker() {
                    if (blockerButton && blockerButton.parentNode) blockerButton.parentNode.removeChild(blockerButton);
                    window.removeEventListener('focus', removeBlocker);
                }
                window.addEventListener('focus', removeBlocker);
            });

            window.blurFocusHandlersInstalled = true;
        }

        function FocusGame(checkingPauseStatus) {
            if (checkingPauseStatus === undefined) checkingPauseStatus = true;
            if (!canvas) return;
            requestAnimationFrame(function () {
                if (checkingPauseStatus && isPausedGame) return;
                var active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
                try { canvas.focus({ preventScroll: true }); } catch (e) {}
            });
        }

        function SetVisibility(visibility) {
            if (ysdk !== null && initGame === true && isVisibility !== visibility) {
                isVisibility = visibility;
                YG2Instance('SetFocusWindowGame', visibility ? 'true' : 'false');
            }
        }

        function PauseCallback() {
            isPausedGame = true;
            YG2Instance('SetPauseGame', 'true');
        }

        function ResumeCallback() {
            isPausedGame = false;
            YG2Instance('SetPauseGame', 'false');
            FocusGame(false);
        }

        function YG2Instance(method, arg) {
            if (ygGameInstance == null) return;
            function send() {
                try {
                    if (!ygGameInstance) return;
                    if (arg === undefined) ygGameInstance.SendMessage('YG2Instance', method);
                    else ygGameInstance.SendMessage('YG2Instance', method, arg);
                } catch (e) {}
            }
            if (!initGame) setTimeout(send, 100);
            else send();
        }

        function LogStyledMessage(message, style) {
            console.log('%c' + message, style || 'color: #FFDF73; background-color: #454545');
        }

        function UpdateProgress(value) {
            try {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                var v = Math.max(0.05, Math.min(1, value));
                progressBarFull.style.width = (100 * v) + "%";
            } catch (e) {}
        }

        var brotliModule = null;
        function GetBrotli() {
            if (brotliModule) return Promise.resolve(brotliModule);
            return import(CFG.BROTLI).then(function (m) {
                return m["default"];
            }).then(function (mod) {
                if (!mod || typeof mod.decompress !== "function") throw new Error("bad brotli module");
                brotliModule = mod;
                return mod;
            });
        }

        function LooksRaw(kind, u) {
            if (u.length < 4) return false;
            if (kind === "wasm") return (u[0] === 0x00 && u[1] === 0x61 && u[2] === 0x73 && u[3] === 0x6D);
            if (kind === "data") return (u[0] === 0x55 && u[1] === 0x6E && u[2] === 0x69 && u[3] === 0x74);
            var n = Math.min(64, u.length);
            for (var i = 0; i < n; i++) {
                var c = u[i];
                if (c === 9 || c === 10 || c === 13) continue;
                if (c < 32 || c > 126) return false;
            }
            return true;
        }

        function Decode(kind, bytes) {
            if (LooksRaw(kind, bytes)) return Promise.resolve(bytes);
            return GetBrotli().then(function (mod) {
                var out = mod.decompress(bytes);
                return out && out.length ? out : bytes;
            })["catch"](function (e) {
                console.error("[brotli] " + kind, e);
                throw e;
            });
        }

        var mergedParts = 0;
        var totalParts = CFG.DATA_PARTS + CFG.WASM_PARTS + 1;

        function FetchParts(name, count) {
            var chunks = [], total = 0, index = 0;
            function next() {
                if (index >= count) {
                    var merged = new Uint8Array(total), offset = 0;
                    for (var i = 0; i < chunks.length; i++) { merged.set(chunks[i], offset); offset += chunks[i].length; }
                    return Promise.resolve(merged);
                }
                return fetch(buildUrl + "/" + name + ".part" + index).then(function (r) {
                    if (!r.ok) throw new Error(name + ".part" + index + " " + r.status);
                    return r.arrayBuffer();
                }).then(function (buf) {
                    var bytes = new Uint8Array(buf);
                    chunks.push(bytes);
                    total += bytes.length;
                    mergedParts++;
                    UpdateProgress((mergedParts / totalParts) * 0.4);
                    index++;
                    return next();
                });
            }
            return next();
        }

        function FetchSingle(name) {
            return fetch(buildUrl + "/" + name).then(function (r) {
                if (!r.ok) throw new Error(name + " " + r.status);
                return r.arrayBuffer();
            }).then(function (buf) {
                mergedParts++;
                UpdateProgress((mergedParts / totalParts) * 0.4);
                return new Uint8Array(buf);
            });
        }

        function BlobUrl(bytes, mime) {
            return URL.createObjectURL(new Blob([bytes], { type: mime }));
        }

        function PrepareFiles() {
            return FetchSingle("NeedleGame.framework.js").then(function (b) {
                return Decode("js", b);
            }).then(function (b) {
                config.frameworkUrl = BlobUrl(b, "application/javascript");
                return FetchParts("NeedleGame.wasm.br", CFG.WASM_PARTS);
            }).then(function (b) {
                return Decode("wasm", b);
            }).then(function (b) {
                config.codeUrl = BlobUrl(b, "application/wasm");
                return FetchParts("NeedleGame.data.br", CFG.DATA_PARTS);
            }).then(function (b) {
                return Decode("data", b);
            }).then(function (b) {
                config.dataUrl = BlobUrl(b, "application/octet-stream");
            });
        }

        function StartUnityInstance_IfUnloaded() {
            if (unityStarted || !loaderReady || !filesReady) return;
            if (typeof StartUnityInstance === "function") StartUnityInstance();
        }

        function IsLocalHost() {
            try {
                if (window.top !== window) return false;
                var host = window.location.hostname;
                if (host === "localhost" || host === "127.0.0.1" || host.endsWith(".local")) return true;
            } catch (error) { return false; }
            return false;
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
            StartUnityInstance = function () {
                if (unityStarted) return;
                unityStarted = true;
                createUnityInstance(canvas, config, function (progress) {
                    UpdateProgress(0.4 + progress * 0.6);
                }).then(function (unityInstance) {
                    ygGameInstance = unityInstance;
                    window.unityInstance = unityInstance;
                    loadingCover.style.background = "";
                    loadingCover.style.display = "none";
                    FocusGame();
                })["catch"](function (message) {
                    console.error(message);
                });
            };
            loaderReady = true;
            InstallBlurFocusBlocker();
            StartUnityInstance_IfUnloaded();
        };
        script.onerror = function () { console.error("loader not found: " + loaderUrl); };
        document.body.appendChild(script);

        PrepareFiles().then(function () {
            filesReady = true;
            return InitYSDK();
        }).then(function () {
            StartUnityInstance_IfUnloaded();
        })["catch"](function (e) {
            console.error("[prepare] ", e);
            try { progressBarFull.style.background = "#c0392b"; progressBarFull.style.width = "100%"; } catch (e2) {}
        });

        function InitYSDK() {
            return Promise.resolve().then(function () {
                return window.YaGames.init();
            }).then(function (sdk) {
                ysdk = sdk;
                try { ysdk.on('game_api_pause', PauseCallback); } catch (e) {}
                try { ysdk.on('game_api_resume', ResumeCallback); } catch (e) {}
                return RequestingEnvironmentData();
            }).then(function () {
                return InitPlayer();
            }).then(function () {
                return LoadCloud();
            }).then(function () {
                return InitPayments();
            }).then(function () {
                return GetAllGames();
            }).then(function () {
                initYSDK = true;
                if (ygGameInstance != null) ygGameInstance.SendMessage('YG2Instance', 'InitSDKComplete');
            })["catch"](function (e) {
                console.error('CRASH Initialization SDK: ', e);
            });
        }

        function InitGame() {
            initGame = true;
            setTimeout(function () {
                if (isPausedGame == true) YG2Instance('SetPauseGame', 'true');
            }, 100);
        }

        var cloudSaves = NO_DATA;

        function SaveCloud(jsonData, flush) {
            if (player == null) return;
            try {
                player.setData({ saves: [jsonData] }, flush);
            } catch (e) {
                console.error('CRASH Save Cloud: ', e.message);
            }
        }

        function LoadCloud() {
            return new Promise(function (resolve) {
                function Final(res) {
                    cloudSaves = res;
                    YG2Instance('SetLoadSaves', res);
                    resolve(res);
                }
                if (ysdk == null || player == null) { Final(NO_DATA); return; }
                try {
                    player.getData(["saves"]).then(function (data) {
                        if (data && data.saves) Final(JSON.stringify(data.saves));
                        else Final(NO_DATA);
                    })["catch"](function () { Final(NO_DATA); });
                } catch (e) { Final(NO_DATA); }
            });
        }

        function StickyAdActivity(show) {
            try {
                if (!ysdk) return;
                ysdk.adv.getBannerAdvStatus().then(function (r) {
                    if (r && r.stickyAdvIsShowing) {
                        if (!show) ysdk.adv.hideBannerAdv();
                    } else if (show) {
                        ysdk.adv.showBannerAdv();
                    }
                })["catch"](function () {});
            } catch (e) {
                console.error('CRASH StickyAdv activity: ', e.message);
            }
        }

        function RewardedAdvShow(id) {
            try {
                if (!ysdk) return;
                ysdk.adv.showRewardedVideo({
                    callbacks: {
                        onOpen: function () { YG2Instance('OpenRewardedAdv'); },
                        onClose: function () { YG2Instance('CloseRewardedAdv'); FocusGame(); },
                        onRewarded: function () { YG2Instance('RewardAdv', id); },
                        onError: function () { YG2Instance('ErrorRewardedAdv'); }
                    }
                });
            } catch (err) {
                console.error('CRASH Rewarded Adv Show: ', err.message);
            }
        }

        var paymentsData = NO_DATA;
        var payments = null;

        function InitPayments() {
            return new Promise(function (resolve) {
                function Final(res) {
                    paymentsData = res;
                    YG2Instance('PaymentsEntries', res);
                    resolve(res);
                }
                if (ysdk == null) { Final(NO_DATA); return; }
                try {
                    ysdk.getPayments().then(function (_payments) {
                        payments = _payments;
                        payments.getCatalog().then(function (products) {
                            var productID = [], title = [], description = [], imageURI = [], price = [],
                                priceValue = [], priceCurrencyCode = [], currencyImageURL = [], consumed = [];
                            payments.getPurchases().then(function (purchases) {
                                for (var i = 0; i < products.length; i++) {
                                    productID[i] = products[i].id;
                                    title[i] = products[i].title;
                                    description[i] = products[i].description;
                                    imageURI[i] = products[i].imageURI;
                                    price[i] = products[i].price;
                                    priceValue[i] = products[i].priceValue;
                                    priceCurrencyCode[i] = products[i].priceCurrencyCode;
                                    currencyImageURL[i] = products[i].getPriceCurrencyImage("medium");
                                    consumed[i] = true;
                                    for (var i2 = 0; i2 < purchases.length; i2++) {
                                        if (purchases[i2].productID === productID[i]) { consumed[i] = false; break; }
                                    }
                                }
                                Final(JSON.stringify({
                                    "id": productID, "title": title, "description": description, "imageURI": imageURI,
                                    "price": price, "priceValue": priceValue, "priceCurrencyCode": priceCurrencyCode,
                                    "currencyImageURL": currencyImageURL, "consumed": consumed,
                                    "language": ysdk.environment.i18n.lang
                                }));
                            });
                        });
                    })["catch"](function () { Final(NO_DATA); });
                } catch (e) { Final(NO_DATA); }
            });
        }

        function BuyPayments(id) {
            try {
                if (payments != null) {
                    payments.purchase({ id: id }).then(function () {
                        YG2Instance('OnPurchaseSuccess', id);
                        FocusGame();
                    })["catch"](function () {
                        YG2Instance('OnPurchaseFailed', id);
                        FocusGame();
                    });
                } else {
                    YG2Instance('OnPurchaseFailed', id);
                }
            } catch (e) {
                YG2Instance('OnPurchaseFailed', id);
                FocusGame();
            }
        }

        function ConsumePurchase(id, onPurchaseSuccess) {
            try {
                if (payments == null) return;
                payments.getPurchases().then(function (purchases) {
                    for (var i = 0; i < purchases.length; i++) {
                        if (purchases[i].productID === id) {
                            if (onPurchaseSuccess) YG2Instance('OnPurchaseSuccess', id);
                            else payments.consumePurchase(purchases[i].purchaseToken);
                        }
                    }
                })["catch"](function () {});
            } catch (e) {
                console.error('CRASH Consume Purchase: ', e.message);
            }
        }

        function ConsumePurchases(onPurchaseSuccess) {
            try {
                if (payments == null) return;
                payments.getPurchases().then(function (purchases) {
                    for (var i = 0; i < purchases.length; i++) {
                        if (onPurchaseSuccess) YG2Instance('OnPurchaseSuccess', purchases[i].productID);
                        else payments.consumePurchase(purchases[i].purchaseToken);
                    }
                })["catch"](function () {});
            } catch (e) {
                console.error('CRASH Consume purchases: ', e.message);
            }
        }

        var allGamesData = NO_DATA;

        function GetAllGames() {
            return new Promise(function (resolve) {
                function Final(res) { allGamesData = res; resolve(res); }
                if (ysdk == null) { Final(NO_DATA); return; }
                try {
                    ysdk.features.GamesAPI.getAllGames().then(function (r) {
                        var games = (r && r.games) || [];
                        var appID = [], title = [], url = [], coverURL = [], iconURL = [];
                        for (var i = 0; i < games.length; i++) {
                            appID[i] = games[i].appID;
                            title[i] = games[i].title;
                            url[i] = games[i].url;
                            coverURL[i] = games[i].coverURL;
                            iconURL[i] = games[i].iconURL;
                        }
                        Final(JSON.stringify({
                            "appID": appID, "title": title, "url": url,
                            "coverURL": coverURL, "iconURL": iconURL,
                            "developerURL": (r && r.developerURL) || ""
                        }));
                    })["catch"](function () { Final(NO_DATA); });
                } catch (e) { Final(NO_DATA); }
            });
        }

        function SetLeaderboard(name, score, extraData) {
            if (!ysdk) return;
            try { ysdk.leaderboards.setScore(name, score, extraData); }
            catch (e) { console.error('CRASH Set Leaderboard: ', e.message); }
        }

        function GetLeaderboard(nameLB, quantityTop, quantityAround, photoSize, auth) {
            if (!ysdk) return;
            var jsonEntries = { technoName: '', isDefault: false, isInvertSortOrder: false, decimalOffset: 0, type: '' };

            ysdk.leaderboards.getDescription(nameLB)
                .then(function (res) {
                    jsonEntries.technoName = nameLB;
                    jsonEntries.isDefault = res["default"];
                    jsonEntries.isInvertSortOrder = res.description.invert_sort_order;
                    jsonEntries.decimalOffset = res.description.score_format.options.decimal_offset;
                    jsonEntries.type = res.description.type;
                    return ysdk.leaderboards.getEntries(nameLB, {
                        quantityTop: quantityTop, includeUser: auth, quantityAround: quantityAround
                    });
                })
                .then(function (res) {
                    var jsonPlayers = EntriesLB(res, photoSize);
                    var combinedJson = Object.assign({}, jsonEntries, jsonPlayers);
                    YG2Instance('LeaderboardEntries', JSON.stringify(combinedJson));
                })["catch"](function (err) { console.error(err); });
        }

        function EntriesLB(res, photoSize) {
            var LbdEntriesText = '';
            var plCount = res.entries.length;

            var ranks = new Array(plCount);
            var photos = new Array(plCount);
            var names = new Array(plCount);
            var scores = new Array(plCount);
            var uniqueIDs = new Array(plCount);
            var extraDataArray = new Array(plCount);

            for (var i = 0; i < plCount; i++) {
                ranks[i] = res.entries[i].rank;
                scores[i] = res.entries[i].score;
                uniqueIDs[i] = res.entries[i].player.uniqueID;
                photos[i] = res.entries[i].player.getAvatarSrc(photoSize);

                if (res.entries[i].extraData == "" || res.entries[i].extraData == null) extraDataArray[i] = NO_DATA;
                else extraDataArray[i] = res.entries[i].extraData;

                if (res.entries[i].player.scopePermissions.public_name !== "allow") names[i] = "anonymous";
                else names[i] = res.entries[i].player.publicName;

                LbdEntriesText += ranks[i] + '. ' + names[i] + ": " + scores[i] + '\n';
            }

            if (plCount === 0) LbdEntriesText = 'no data';

            return {
                "entries": LbdEntriesText, "ranks": ranks, "photos": photos,
                "names": names, "scores": scores, "uniqueIDs": uniqueIDs,
                "extraDataArray": extraDataArray
            };
        }

        var nowFullAdOpen = false;

        function InterAdvShow() {
            try {
                if (ysdk == null) return;
                if (nowFullAdOpen == true) return;
                ysdk.adv.showFullscreenAdv({
                    callbacks: {
                        onOpen: function () {
                            nowFullAdOpen = true;
                            if (initGame === true) YG2Instance('OpenInterAdv');
                        },
                        onClose: function (wasShown) {
                            nowFullAdOpen = false;
                            if (initGame === true) YG2Instance('CloseInterAdv', wasShown ? 'true' : 'false');
                            FocusGame();
                        },
                        onError: function () {
                            nowFullAdOpen = false;
                            YG2Instance('ErrorInterAdv');
                            FocusGame();
                        }
                    }
                });
            } catch (e) {
                console.error('CRASH Interstitial Adv Show: ', e.message);
            }
        }

        var environmentData = NO_DATA;

        function RequestingEnvironmentData() {
            return new Promise(function (resolve) {
                function Final(res) {
                    environmentData = res;
                    YG2Instance('SetEnvirData', res);
                    resolve(res);
                }
                if (ysdk == null) { Final(NO_DATA); return; }
                try {
                    var browser = navigator.userAgent;
                    if (browser.indexOf('YaBrowser') >= 0 || browser.indexOf('YaSearchBrowser') >= 0) browser = 'Yandex';
                    else if (browser.indexOf('Opera') >= 0 || browser.indexOf('OPR') >= 0) browser = 'Opera';
                    else if (browser.indexOf('Firefox') >= 0) browser = 'Firefox';
                    else if (browser.indexOf('MSIE') >= 0) browser = 'IE';
                    else if (browser.indexOf('Edge') >= 0) browser = 'Edge';
                    else if (browser.indexOf('Chrome') >= 0) browser = 'Chrome';
                    else if (browser.indexOf('Safari') >= 0) browser = 'Safari';
                    else browser = 'Other';

                    Final(JSON.stringify({
                        "language": ysdk.environment.i18n.lang,
                        "domain": ysdk.environment.i18n.tld,
                        "deviceType": ysdk.deviceInfo.type,
                        "isMobile": ysdk.deviceInfo.isMobile(),
                        "isDesktop": ysdk.deviceInfo.isDesktop(),
                        "isTablet": ysdk.deviceInfo.isTablet(),
                        "isTV": ysdk.deviceInfo.isTV(),
                        "appID": ysdk.environment.app.id,
                        "browserLang": ysdk.environment.browser.lang,
                        "payload": ysdk.environment.payload,
                        "platform": navigator.platform,
                        "browser": browser
                    }));
                } catch (e) { Final(NO_DATA); }
            });
        }

        var playerData = NO_DATA;
        var player = null;

        function InitPlayer() {
            function Final(res) {
                playerData = res;
                YG2Instance('SetAuth', res);
                return res;
            }
            if (!ysdk) return Promise.resolve(Final(NotAuthorized(false)));
            return ysdk.getPlayer().then(function (p) {
                player = p;
                if (!player || !player.isAuthorized()) return Final(NotAuthorized(true));
                return Final(JSON.stringify({
                    playerAuth: "resolved",
                    playerName: player.getName(),
                    playerId: player.getUniqueID(),
                    playerPhoto: player.getPhoto('medium'),
                    payingStatus: player.getPayingStatus()
                }));
            })["catch"](function () {
                player = null;
                return Final(NotAuthorized(false));
            });
        }

        function NotAuthorized(hasPlayer) {
            return JSON.stringify({
                playerAuth: "rejected",
                playerName: "unauthorized",
                playerId: (hasPlayer && player && player.getUniqueID) ? player.getUniqueID() : "unauthorized",
                playerPhoto: "no data",
                payingStatus: "unknown"
            });
        }

        function OpenAuthDialog() {
            if (!ysdk) return;
            try {
                ysdk.auth.openAuthDialog().then(function () {
                    return InitPlayer();
                }).then(function () {
                    YG2Instance('LoggedIn');
                })["catch"](function () { InitPlayer(); });
            } catch (e) {}
        }
    </script>

</div>

<script>
(function(){

function loadSave(){
try{

if(!o||!o.saves||!o.saves.length)return null;
var s=JSON.parse(o.saves[0]);
if(!s||typeof s!=="object")return null;
return {o:o,s:s};
}catch(e){return null;}
}
function saveSave(x){
x.o.saves[0]=JSON.stringify(x.s);
localStorage.setItem("ya_player_data",JSON.stringify(x.o));
}
function editMoney(){
var x=loadSave();

x.s.balance=n;
saveSave(x);
note("money set to "+n+" - reloading");
setTimeout(function(){location.reload();},600);
}
function editGems(){
var x=loadSave();
if(!x){note("no save yet - play one game, then try again");return;}
var v=prompt("How many gems do you want?",Math.floor(x.s.diamonds||0));
if(v===null)return;

x.s.diamonds=n;

note("gems set to "+n+" - reloading");

}
function toggleBag(){

if(!x){note("no save yet - play one game, then try again");return;}
x.s.hasInfiniteBag=!x.s.hasInfiniteBag;
saveSave(x);
note("infinite storage "+(x.s.hasInfiniteBag?"ON":"OFF")+" - reloading");

}
function ruinTheFun(){

if(!x){note("no save yet - play one game, then try again");return;}
var s=x.s;
s.balance=999999999;
s.diamonds=999999999;
["hasPitchfork","hasBomb","hasMagnet","hasClover","iapPitchfork","iapBomb","iapMagnet","iapClover"].forEach(function(k){s[k]=true;});

["handSpeedLevel","handAmountLevel","handAutoLevel","pitchforkSpeedLevel","pitchforkAmountLevel","pitchforkAutoLevel","bombSpeedLevel","bombAmountLevel","bombAutoLevel","magnetSpeedLevel","magnetAmountLevel","magnetCoolLevel","cloverLuckLevel"].forEach(function(k){s[k]=99;});

if(x&&b)b.textContent="INF STORAGE: "+(x.s.hasInfiniteBag?"ON":"OFF");
}catch(e){}
}
document.getElementById("modMoney").onclick=editMoney;
document.getElementById("modGems").onclick=editGems;
document.getElementById("modBag").onclick=toggleBag;

function sound(){if(played||!notice.classList.contains("show"))return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!nAudio||nAudio.state==="closed")nAudio=new AC();var go=function(){if(played||nAudio.state!=="running")return;played=true;var t=nAudio.currentTime;[880,1174.66].forEach(function(f,i){var o=nAudio.createOscillator(),g=nAudio.createGain();o.type="sine";o.frequency.setValueAtTime(f,t+i*.09);g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.09,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.35);o.connect(g).connect(nAudio.destination);o.start(t+i*.09);o.stop(t+i*.09+.4);});};if(nAudio.state==="suspended")nAudio.resume().then(go).catch(function(){});else go();}catch(e){}}
